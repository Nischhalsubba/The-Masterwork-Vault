name: SEO static reference validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.node-version
      - run: npm ci --no-fund
      - name: Verify field Core Web Vitals and external reference classifications
        run: node --test scripts/tests/field-cwv.test.mjs scripts/tests/reference-audit.test.mjs
      - name: Build content-backed HTML reference pages
        run: npm run build
      - name: Verify sitemap, canonicals and JSON-LD in generated HTML
        run: npm run verify:seo
      - name: Ensure source HTML is available without React hydration
        run: |
          test -f dist/guides/index.html
          test -f dist/guides/recipes/index.html
          test -f dist/guides/materials/index.html
          ! grep -q '<script src=' dist/guides/index.html
      - name: Audit source link HTTP reachability without conflating bot blocks with broken links
        continue-on-error: true
        run: node scripts/audit-external-references.mjs
      - name: Upload external source link reachability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: masterwork-external-reference-audit
          path: app/link-audit-results/external-references.json
          retention-days: 7
          if-no-files-found: warn
