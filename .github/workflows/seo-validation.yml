name: SEO static reference validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.node-version
      - run: npm ci --no-fund
      - name: Verify field Core Web Vitals error handling without API requests
        run: node --test scripts/tests/field-cwv.test.mjs
      - name: Build content-backed HTML reference pages
        run: npm run build
      - name: Verify sitemap, canonicals and JSON-LD in generated HTML
        run: npm run verify:seo
      - name: Ensure source HTML is available without React hydration
        run: |
          test -f dist/guides/index.html
          test -f dist/guides/recipes/index.html
          test -f dist/guides/materials/index.html
          ! grep -q '<script src=' dist/guides/index.html
