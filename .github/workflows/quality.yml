name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.node-version
      - name: Verify npm version
        run: test "$(npm --version)" = "11.17.0"
      - name: Install dependencies
        run: npm install --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Build production application
        run: npm run build
      - name: Verify repeat builds do not mutate authored source
        run: |
          sha256sum src/App.tsx src/components/CraftingWorkbench.tsx src/data/catalog.ts src/main.tsx > /tmp/masterwork-authored.sha256
          npm run build
          sha256sum --check /tmp/masterwork-authored.sha256
      - name: Verify profession reference interactions first
        id: reference-quality
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: reference-results.json
        run: npx --no-install playwright test tests/profession-reference.spec.ts --workers=2 --max-failures=1 --global-timeout=180000 --reporter=list,json
      - name: Run full browser quality suite
        if: steps.reference-quality.outcome == 'success'
        id: browser-quality
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: npx --no-install playwright test --workers=2 --global-timeout=480000 --reporter=list,json
      - name: Upload browser diagnostics and visual previews
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: masterwork-workspace-previews
          path: |
            app/test-results/**/material-sources-*.png
            app/test-results/**/workspace-*.png
            app/test-results/**/journey-*.png
            app/test-results/**/error-context.md
            app/reference-results.json
            app/playwright-results.json
          if-no-files-found: warn
          retention-days: 1
      - name: Require both browser gates to pass
        if: steps.reference-quality.outcome != 'success' || steps.browser-quality.outcome != 'success'
        run: exit 1
