name: Quality

on:
  pull_request:
  push:
    branches: [main, 'agent/**']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Recipe and knowledge integrity
        run: npm run verify:release
      - name: TypeScript and production build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Desktop, mobile, accessibility and responsive E2E
        run: npx playwright test
      - name: Preserve test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterwork-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
