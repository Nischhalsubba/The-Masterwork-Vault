name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.node-version
      - name: Verify npm version
        run: test "$(npm --version)" = "11.17.0"
      - name: Install dependencies
        run: npm install --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Build production application
        run: npm run build
      - name: Run browser quality suite
        id: browser-quality
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: npx --no-install playwright test --reporter=list,json
      - name: Upload compact browser diagnostics
        if: steps.browser-quality.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: masterwork-playwright-results
          path: app/playwright-results.json
          if-no-files-found: error
          retention-days: 1
      - name: Fail browser quality suite
        if: steps.browser-quality.outcome == 'failure'
        run: exit 1
