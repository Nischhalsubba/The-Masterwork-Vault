name: One-time verified branch cleanup (2026-10-28)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-cleanup-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masterwork-branch-cleanup
  cancel-in-progress: false

jobs:
  delete-safely:
    name: Remove only verified, ancestry-preserved branch refs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Confirm archived heads and delete retired branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          default="$(gh api "repos/$GH_REPO" --jq '.default_branch')"
          if [[ "$default" != "main" ]]; then
            echo "::error::Default branch changed; refusing deletion"
            exit 1
          fi
          cleaned=0
          skipped=0
          failures=0
          while IFS=$'\t' read -r branch expected; do
            [[ -n "$branch" ]] || continue
            if [[ "$branch" == "main" || "$branch" == refs/* ]]; then
              echo "::error::Unsafe branch name: $branch"
              exit 1
            fi
            actual="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [[ -z "$actual" ]]; then
              echo "Already absent: $branch"
              continue
            fi
            if [[ "$actual" != "$expected" ]]; then
              echo "::warning::Branch changed since inventory; keeping $branch ($actual)"
              skipped=$((skipped + 1))
              continue
            fi
            ahead="$(gh api "repos/$GH_REPO/compare/main...$branch" --jq '.ahead_by')"
            if [[ "$ahead" != "0" ]]; then
              echo "::warning::Unpreserved commits ($ahead) in $branch; keeping it"
              skipped=$((skipped + 1))
              continue
            fi
            if gh api --silent --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"; then
              echo "Deleted safely: $branch"
              cleaned=$((cleaned + 1))
            else
              echo "::error::Could not delete $branch"
              failures=$((failures + 1))
            fi
          done <<'BRANCH_MANIFEST'
          agent/full-e2e-seo-fixes	5b15cbdaa426cc9bc4dbd0b925f9b3c9c7e375b7
          agent/journey-layout-polish	59fe2c3e8687430a7fd11edc1dc93e72d2065939
          agent/journey-page-route	487842ebfdbae05970037a167ba2a3147ddbbaf2
          agent/journey-page-route-copy	487842ebfdbae05970037a167ba2a3147ddbbaf2
          agent/journey-page-route-ready	487842ebfdbae05970037a167ba2a3147ddbbaf2
          agent/journey-page-route-ship	487842ebfdbae05970037a167ba2a3147ddbbaf2
          agent/journey-workspace-redesign	be0f64834bdd7c9efd5ae5f817cb06b36ebf8944
          agent/masterwork-next-level-2026-08-11	bb49d6abf614b388f453f74136e986a33a5ddd48
          agent/modern-masterwork-progression	fc7eb08fbbb9fb39ed074933684bb601d8869e5e
          agent/post-merge-release-hardening-2026-08-12	9b21cbb48f4b3be703b6acefe1ba1158edfb05f5
          agent/unified-crafting-knowledge-pool	a9bb1e99feb17243225f418973c874210a3474f6
          chore/netlify-policy-guard	3239b86eb876928a600c9dbf0bd8798e1e70f423
          chore/netlify-policy-strict-false	4c8ef7e94e1d020b6129a160163d723b63cd6b88
          chore/repository-cleanup	451dc2ed794d1a920afbe894933cd41869954f7e
          chore/2026-security-baseline	999a5898b669f455adf2828d853cce4e52592fff
          dependabot/github_actions/actions/setup-node-7.1.0	faf7b217f50b5870068c81e089937310dc8c409e
          feat/crafting-tree-redesign	067842f3657bd711dd346f25108e5869ad9d9764
          feat/design-system-density	12afd374553ac8f46875417eb40ce4d5119a8e85
          feat/journey-research-completion	a0402e30bdfd1e9d5416fbfeae0775eda67c045f
          feat/masterwork-completion-pass	3d3ef548fc0adc0f7d34da374f26f5502947641c
          feat/masterwork-data-completeness	9219d29c084ce392fd99a35e5621c2f5e76ea2da
          feat/material-acquisition-guides	92bfd18456ab9651f71c0f05fe11b4a9bb379bce
          feat/mobile-masterwork-journey	5f9077fd04aa225c8d9305c177ab9ff51bec6144
          feat/purposeful-app-redesign	f496e8560e1152ea9b847a8e3f1ea26c8feb6e1d
          feat/seo-static-knowledge-hub-20261028	84d5a31a6d81a9359d37f4c8ddd475625a38ba5c
          feature/ui-revamp-completion	34e5fa8e6f63c5a4800b6438efd8ce68a21106a3
          fix/complete-masterwork-backlog	bccb4a73b4536f8d9b605cafcd5771c73191fa33
          fix/crux-field-data-reliability-20261028	cdc2125a26750c3a179b88ab093162f665b55cf5
          fix/forge-v4-catalog-visibility-20261027	8694e74c86a34a623efdb13f48bde8a66b758176
          fix/local-neverwinter-icons	083c7257a4144d20e085168c714780647ff518f2
          fix/mobile-acquisition-first-20261027	5eb58f4abcf7840dac1277ee294107ade8e76042
          fix/mobile-lcp-seo-hardening-20261028	8048a0abcb0e7c39a590643d3cee10c72fe9abc2
          fix/potion-raw-material-icons	d2c17cf93fe93bc78d07b8226f100a07cc5957d6
          fix/visual-consistency-audit-20261028	eb1f0ce4fe885b6adf8bd5607a8c388b19fe9725
          redesign/forge-v4-refinement-phases-20261027	aa4f30ccf1b1ad8c08a3c8649ca32822ee0115b2
          redesign/forge-v4-structure-repair	560e131a63cb90668fa6c42349ad431c156aca4a
          redesign/neverwinter-forge-v4	f22cacb213969106cd9af035c56613b85c6acbd5
          BRANCH_MANIFEST

          echo "Deleted: $cleaned; deliberately skipped: $skipped; failures: $failures"
          remaining="$(gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name' | grep -v '^main$' || true)"
          if [[ -n "$remaining" ]]; then
            echo "::error::Non-main branches remain:"
            echo "$remaining"
            exit 1
          fi
          echo "Verification complete: main is the only branch."
