name: Research workspace
on:
  push:
    branches: [feat/journey-research-completion]
    paths: [.github/workflows/research-workspace.yml, app/scripts/review-public-sources.py]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read bounded public research sources
        run: python3 app/scripts/review-public-sources.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: research-public-sources
          path: research-public/
          retention-days: 1
          if-no-files-found: error
