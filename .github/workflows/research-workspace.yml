name: Research workspace
on:
  push:
    branches: [feat/journey-research-completion]
    paths: [.github/workflows/research-workspace.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'Nischhalsubba/The-Masterwork-Vault' && github.ref == 'refs/heads/feat/journey-research-completion'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Read the two scoped public source collections
        run: python3 app/scripts/review-public-sources.py
      - name: Import only reviewed recipe facts
        run: |
          python3 app/scripts/import-profession-reference.py research-public app/src/data/professionReference.snapshot.json
          echo 'dd87d1d5e331d8a0705b59f74fc4ad9535095d4daf3a26631bba78e40dedc5fa  app/src/data/professionReference.snapshot.json' | sha256sum --check
      - name: Save reviewed snapshot on this feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/src/data/professionReference.snapshot.json
          git commit -m 'data: add reviewed 907-task community snapshot [skip netlify]'
          git push origin HEAD:refs/heads/feat/journey-research-completion
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-profession-snapshot
          path: app/src/data/professionReference.snapshot.json
          retention-days: 1
          if-no-files-found: error
