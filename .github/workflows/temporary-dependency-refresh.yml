name: Temporary dependency refresh
on:
  push:
    branches:
      - fix/mobile-acquisition-first-20261027
    paths:
      - .github/workflows/temporary-dependency-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-acquisition-first-20261027
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Upgrade Vite and resolve current advisories
        working-directory: app
        run: |
          npm install vite@8.3.5 --save-dev --save-exact
          npm audit fix
          npm audit --audit-level=high
      - name: Commit reviewed dependency manifests to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package.json app/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): update Vite and vulnerable source-map dependency"
            git push origin HEAD:fix/mobile-acquisition-first-20261027
          fi
