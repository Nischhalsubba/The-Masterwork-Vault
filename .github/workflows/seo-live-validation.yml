name: Production SEO HTTP audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.node-version
      - name: Wait for generated SEO sitemap to appear on production
        run: |
          for n in $(seq 1 70); do
            if curl -fsSL --max-time 12 https://neverwintermastercraft.netlify.app/sitemap.xml | grep -q '/guides/recipes/'; then
              echo "Production sitemap published"
              exit 0
            fi
            sleep 10
          done
          echo "Production release was not deployed or its sitemap is unreachable"
          exit 1
      - name: Audit every live sitemap URL and robots responses
        run: node scripts/audit-live-seo.mjs
      - name: Retrieve public CrUX field LCP, CLS and INP if available
        if: always()
        continue-on-error: true
        run: node scripts/audit-field-cwv.mjs
      - name: Upload field Core Web Vitals evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: masterwork-field-vitals
          path: app/field-vitals-results/
          if-no-files-found: warn
