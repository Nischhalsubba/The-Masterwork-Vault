name: Recover superseded quality run
on:
  push:
    branches: [feat/journey-research-completion]
    paths: [.github/workflows/recover-superseded-quality.yml]
permissions:
  contents: read
  actions: write
jobs:
  recover:
    if: github.repository == 'Nischhalsubba/The-Masterwork-Vault' && github.ref == 'refs/heads/feat/journey-research-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only the superseded research-commit check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo='Nischhalsubba/The-Masterwork-Vault'
          run_id='35296670601'
          expected='e4ab0f4aea008d6aa22cfcda3647037c57d1f7d5'
          test "$(gh api repos/$repo/actions/runs/$run_id --jq '.head_sha')" = "$expected"
          test "$(gh api repos/$repo/actions/runs/$run_id --jq '.head_branch')" = 'feat/journey-research-completion'
          state=$(gh api repos/$repo/actions/runs/$run_id --jq '.status')
          if [ "$state" = 'completed' ]; then exit 0; fi
          gh api --method POST repos/$repo/actions/runs/$run_id/cancel
          sleep 30
          state=$(gh api repos/$repo/actions/runs/$run_id --jq '.status')
          if [ "$state" != 'completed' ]; then gh api --method POST repos/$repo/actions/runs/$run_id/force-cancel; fi
