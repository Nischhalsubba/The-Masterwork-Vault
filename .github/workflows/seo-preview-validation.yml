name: SEO Netlify preview HTTP audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/scripts/**'
      - 'app/src/**'
      - 'app/netlify.toml'
      - 'netlify.toml'
      - '.github/workflows/seo-preview-validation.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.node-version
      - name: Wait for Netlify deploy preview
        env:
          PREVIEW_ROOT: https://deploy-preview-${{ github.event.number }}--neverwintermastercraft.netlify.app
        run: |
          for n in $(seq 1 48); do
            if curl -fsSL --max-time 12 "$PREVIEW_ROOT/sitemap.xml" | grep -q '/guides/materials/'; then exit 0; fi
            sleep 10
          done
          echo 'Preview missing or inaccessible to audit runner'
          exit 1
      - name: Verify every preview sitemap URL and SEO metadata
        env:
          SEO_LIVE_URL: https://deploy-preview-${{ github.event.number }}--neverwintermastercraft.netlify.app
        run: node scripts/audit-live-seo.mjs
