name: Apply direct icon assets

on:
  push:
    branches: [main]
    paths:
      - '.github/icon-bootstrap/READY'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Convert verified atlas into 90 physical PNG files
        shell: bash
        run: |
          set -euo pipefail

          if command -v magick >/dev/null 2>&1; then
            IMAGE_TOOL=magick
          elif command -v convert >/dev/null 2>&1; then
            IMAGE_TOOL=convert
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            IMAGE_TOOL=convert
          fi

          tr -d '[:space:]' < src/data/sprite.b64 | base64 -d > /tmp/verified-atlas.webp

          node --input-type=module <<'NODE' > /tmp/icons.tsv
          import fs from 'node:fs'
          const manifest = JSON.parse(fs.readFileSync('scripts/icon-manifest.json', 'utf8'))
          if (!Array.isArray(manifest) || manifest.length !== 90) {
            throw new Error(`Expected 90 icon paths, found ${Array.isArray(manifest) ? manifest.length : 'invalid manifest'}`)
          }
          manifest.forEach((relative, index) => console.log(`${index}\t${relative}`))
          NODE

          rm -rf public/assets/icons/gear public/assets/icons/materials public/assets/icons/tools
          mkdir -p public/assets/icons

          while IFS=$'\t' read -r index relative; do
            col=$((index % 10))
            row=$((index / 10))
            x=$((col * 48))
            y=$((row * 48))
            output="public/assets/icons/${relative}"
            mkdir -p "$(dirname "$output")"
            "$IMAGE_TOOL" /tmp/verified-atlas.webp -crop "48x48+${x}+${y}" +repage "$output"
          done < /tmp/icons.tsv

          count=$(find public/assets/icons -type f -name '*.png' | wc -l | tr -d ' ')
          test "$count" = "90"
          echo "Created $count physical PNG icons"

      - name: Replace runtime atlas code with direct image URLs
        shell: bash
        run: |
          set -euo pipefail

          cat > src/data/catalog.ts <<'EOF'
          import compressedCatalog from './catalog.gz.b64?raw'

          const bytes = Uint8Array.from(atob(compressedCatalog), (char) => char.charCodeAt(0))
          const stream = new Blob([bytes.buffer as ArrayBuffer]).stream().pipeThrough(new DecompressionStream('gzip'))
          const text = await new Response(stream).text()
          const catalog = JSON.parse(text)

          const slug = (value: string) => value
            .toLowerCase()
            .replace(/\+1/g, '')
            .replace(/[’']/g, '')
            .replace(/&/g, 'and')
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '')

          const iconUrl = (category: 'gear' | 'tools' | 'materials', name: string) =>
            `${import.meta.env.BASE_URL}assets/icons/${category}/${slug(name)}.png`

          for (const item of catalog.items ?? []) {
            const category = item.kind === 'Profession Tool' ? 'tools' : 'gear'
            item.icon = iconUrl(category, item.name)
            delete item.iconIndex
          }

          for (const material of catalog.materials ?? []) {
            material.icon = iconUrl('materials', material.name)
            delete material.iconIndex
          }

          if (catalog.meta) {
            delete catalog.meta.sprite
            catalog.meta.icons = {
              mode: 'direct-static-files',
              count: 90,
              root: `${import.meta.env.BASE_URL}assets/icons/`,
            }
          }

          export default catalog
          EOF

          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          let app = fs.readFileSync('src/App.tsx', 'utf8')
          app = app.replace("import spriteDataUri from './data/sprite'\n", '')
          app = app.replace('CatalogData, ItemEntry, MaterialEntry', 'CatalogData, ItemEntry')

          const start = app.indexOf('function Sprite(')
          const end = app.indexOf('\nfunction Source(', start)
          if (start < 0 || end < 0) throw new Error('Could not locate legacy Sprite component')

          const directComponent = `function CatalogIcon({\n  src,\n  alt,\n  size = 48,\n}: {\n  src?: string | null\n  alt: string\n  size?: number\n}) {\n  const [failed, setFailed] = useState(false)\n\n  useEffect(() => {\n    setFailed(false)\n  }, [src])\n\n  if (!src || failed) {\n    return <span className="catalog-icon icon-fallback" style={{ width: size, height: size }} role="img" aria-label={\`${'${alt}'}, image unavailable\`} />\n  }\n\n  return (\n    <img\n      className="catalog-icon thumb"\n      src={src}\n      alt={alt}\n      width={size}\n      height={size}\n      loading="lazy"\n      decoding="async"\n      style={{ width: size, height: size, objectFit: 'cover' }}\n      onError={() => setFailed(true)}\n    />\n  )\n}\n`

          app = app.slice(0, start) + directComponent + app.slice(end + 1)
          app = app.replace(/<Sprite\s+index=\{[^{}]+\}\s+src=\{([^{}]+)\}/g, '<CatalogIcon src={$1}')

          if (app.includes('<Sprite') || app.includes('iconIndex') || app.includes('spriteDataUri')) {
            throw new Error('Legacy sprite references remain in App.tsx')
          }
          fs.writeFileSync('src/App.tsx', app)

          let types = fs.readFileSync('src/types.ts', 'utf8')
          types = types.replace(/^\s*iconIndex\?: number \| null\s*$/gm, '')
          types = types.replace(/^\s*sprite: \{[^\n]+\}\s*$/gm, '    icons?: { mode: string; count: number; root: string }')
          fs.writeFileSync('src/types.ts', types)

          let css = fs.readFileSync('src/styles.css', 'utf8')
          css = css.replace(/\.sprite/g, '.catalog-icon').replace(/\.fallback/g, '.icon-fallback')
          fs.writeFileSync('src/styles.css', css)

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.version = '0.1.4'
          pkg.scripts = pkg.scripts || {}
          pkg.scripts.prebuild = 'node scripts/audit-icons.mjs'
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE

      - name: Remove legacy icon metadata from compressed catalog
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { gunzipSync, gzipSync } from 'node:zlib'

          const path = 'src/data/catalog.gz.b64'
          const encoded = fs.readFileSync(path, 'utf8').replace(/\s+/g, '')
          const catalog = JSON.parse(gunzipSync(Buffer.from(encoded, 'base64')).toString('utf8'))

          for (const item of catalog.items ?? []) {
            delete item.icon
            delete item.iconIndex
          }
          for (const material of catalog.materials ?? []) {
            delete material.icon
            delete material.iconIndex
          }
          if (catalog.meta) {
            delete catalog.meta.sprite
            delete catalog.meta.icons
          }

          fs.writeFileSync(path, gzipSync(Buffer.from(JSON.stringify(catalog))).toString('base64') + '\n')
          NODE

      - name: Add mandatory direct-icon build audit
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/audit-icons.mjs <<'EOF'
          import { readFile, stat } from 'node:fs/promises'
          import path from 'node:path'
          import { gunzipSync } from 'node:zlib'

          const ROOT = process.cwd()
          const ICON_ROOT = path.join(ROOT, 'public', 'assets', 'icons')
          const CATALOG_PATH = path.join(ROOT, 'src', 'data', 'catalog.gz.b64')

          const slug = (value) => value
            .toLowerCase()
            .replace(/\+1/g, '')
            .replace(/[’']/g, '')
            .replace(/&/g, 'and')
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '')

          const catalogText = await readFile(CATALOG_PATH, 'utf8')
          const catalog = JSON.parse(
            gunzipSync(Buffer.from(catalogText.replace(/\s+/g, ''), 'base64')).toString('utf8'),
          )

          const expected = [
            ...(catalog.items ?? []).map((item) => ({
              name: item.name,
              relative: `${item.kind === 'Profession Tool' ? 'tools' : 'gear'}/${slug(item.name)}.png`,
            })),
            ...(catalog.materials ?? []).map((material) => ({
              name: material.name,
              relative: `materials/${slug(material.name)}.png`,
            })),
          ]

          if (expected.length !== 90) {
            throw new Error(`Icon audit expected 90 catalog entities, found ${expected.length}`)
          }

          const failures = []
          for (const entry of expected) {
            const filePath = path.join(ICON_ROOT, entry.relative)
            try {
              const info = await stat(filePath)
              if (!info.isFile() || info.size <= 100) {
                failures.push(`${entry.relative}: missing or too small`)
                continue
              }
              const bytes = await readFile(filePath)
              const isPng = bytes.length > 100
                && bytes[0] === 0x89
                && bytes.toString('ascii', 1, 4) === 'PNG'
              if (!isPng) failures.push(`${entry.relative}: not a valid PNG signature`)
            } catch {
              failures.push(`${entry.relative}: missing`)
            }
          }

          if (failures.length) {
            throw new Error(`Direct icon audit failed (${failures.length}):\n${failures.join('\n')}`)
          }

          console.log(`Direct icon audit passed: ${catalog.items.length} craftables + ${catalog.materials.length} materials = ${expected.length}/90 PNG files; 0 missing`)
          EOF

      - name: Delete the atlas system and bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            src/data/sprite.ts \
            src/data/sprite.b64 \
            src/data/verifiedIconIndex.ts \
            scripts/prepare-icons.mjs \
            scripts/icon-manifest.json \
            public/assets/icons/verified-atlas.webp \
            .github/icon-bootstrap/READY \
            .github/workflows/apply-direct-icons.yml
          rmdir .github/icon-bootstrap 2>/dev/null || true

      - name: Verify all 90 files and reject legacy references
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-icons.mjs

          if grep -R -nE 'spriteDataUri|verified-atlas|verifiedIconIndex|sprite\.b64|iconIndex|atlas-icon|function Sprite|<Sprite|meta\.sprite|\.sprite' src scripts package.json; then
            echo 'Legacy atlas/sprite reference found'
            exit 1
          fi

          png_count=$(find public/assets/icons -type f -name '*.png' | wc -l | tr -d ' ')
          test "$png_count" = '90'
          echo "Verified $png_count independent PNG files and zero legacy atlas references"

      - name: Build production app
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-package-lock --ignore-scripts
          npm run build

      - name: Commit tested direct-PNG implementation to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Replace icon atlas with direct PNG assets'
          git push origin HEAD:main
