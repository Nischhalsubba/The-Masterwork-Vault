name: Forge V4 UI validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/**'
      - 'app/index.html'
      - 'app/public/manifest.webmanifest'
      - '.github/workflows/forge-v4-ui-validation.yml'

concurrency:
  group: forge-v4-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.node-version
      - name: Install dependencies without changing lockfile
        run: npm ci --no-fund
      - name: Build V4 application with catalog verification
        run: npm run build
      - name: Verify generated SEO reference pages and sitemap
        run: npm run verify:seo
      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Validate V4 layout and phone navigation first
        run: npx --no-install playwright test tests/forge-v4-structure.spec.ts tests/forge-v4-catalog-visibility.spec.ts tests/forge-refinement-phases.spec.ts tests/mobile-acquisition-first.spec.ts tests/acquisition-responsive-routes.spec.ts tests/phone-header-brand.spec.ts --workers=2 --reporter=list
      - name: Validate all responsive flows and crafting regressions
        run: npx --no-install playwright test --workers=2 --global-timeout=480000 --reporter=list
      - name: Upload V4 browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-v4-layout-evidence
          path: |
            app/test-results/**/forge-workbench-*.png
            app/test-results/**/forge-catalog-readable-*.png
            app/test-results/**/forge-phase-*.png
            app/test-results/**/mobile-acquisition-*.png
            app/test-results/**/acquisition-responsive-*.png
            app/test-results/**/error-context.md
          retention-days: 2
          if-no-files-found: warn
