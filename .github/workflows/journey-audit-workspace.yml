name: Journey audit workspace
on:
  push:
    branches: [feat/mobile-masterwork-journey]
    paths: [.github/workflows/journey-audit-workspace.yml]
permissions:
  contents: read
jobs:
  audit-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: app/.node-version
      - name: Snapshot tracked source for offline audit
        run: git archive --format=tar HEAD > /tmp/masterwork-source.tar
      - name: Prepare tested runtime
        working-directory: app
        run: |
          npm install --no-fund
          npm run build
          tar -czf /tmp/masterwork-runtime.tar.gz node_modules dist
      - name: Export isolated audit workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: masterwork-audit-workspace
          path: |
            /tmp/masterwork-source.tar
            /tmp/masterwork-runtime.tar.gz
          retention-days: 1
          if-no-files-found: error
