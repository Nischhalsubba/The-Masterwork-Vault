name: Finalize reviewed Journey source
on:
  push:
    branches: [feat/mobile-masterwork-journey]
permissions:
  contents: read
concurrency:
  group: finalize-journey-source
  cancel-in-progress: false
jobs:
  finalize:
    if: github.repository == 'Nischhalsubba/The-Masterwork-Vault' && contains(github.event.head_commit.message, '[prepare-journey]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mobile-masterwork-journey
      - name: Refuse a stale starting point
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: app/.node-version
      - name: Materialize reviewed native source once
        run: |
          python3 .github/finalize-journey.py
          sed -i 's/[[:blank:]]*$//' app/src/App.tsx
      - name: Build and check source
        working-directory: app
        run: |
          npm install --no-fund
          npm run build
          sha256sum src/App.tsx src/components/CraftingWorkbench.tsx src/data/catalog.ts src/main.tsx > /tmp/authored.sha256
          npm run build
          sha256sum --check /tmp/authored.sha256
      - name: Commit reviewed app source to the feature branch only
        run: |
          git add -A -- app
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: commit native responsive UI and sourced progression rules [skip netlify]'
          git push origin HEAD:refs/heads/feat/mobile-masterwork-journey
