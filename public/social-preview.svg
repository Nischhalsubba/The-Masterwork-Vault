      <text x="664" y="453" font-family="Arial,sans-serif" font-size="10" fill="#758391">Blacksmithing · craftable</text>
      <text x="1055" y="445" text-anchor="end" font-family="Arial,sans-serif" font-size="15" font-weight="760" fill="#17283e">×3</text>
    </g>
    <g>
      <rect x="612" y="474" width="478" height="52" rx="11" fill="#f6f8fa"/>
      <circle cx="638" cy="500" r="15" fill="#557a9c"/>
      <text x="664" y="497" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#24313d">Masterwork Resin</text>
      <text x="664" y="513" font-family="Arial,sans-serif" font-size="10" fill="#758391">Raw / acquired material</text>
      <text x="1055" y="505" text-anchor="end" font-family="Arial,sans-serif" font-size="15" font-weight="760" fill="#17283e">×2</text>
    </g>
