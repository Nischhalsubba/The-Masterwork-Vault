  <rect x="790" y="584" width="348" height="30" rx="15" fill="#ffffff" opacity=".82"/>
  <text x="964" y="604" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#30465a">Sharandar + Underdark · optimized crafting planner</text>
