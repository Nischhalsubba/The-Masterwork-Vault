<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Masterwork Vault social preview</title>
  <desc id="desc">A realistic preview of the Masterwork Vault crafting catalog with Sharandar recipes and a crafting detail panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eef3f8"/>
      <stop offset="1" stop-color="#dbe7f2"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#132238"/>
      <stop offset="1" stop-color="#243c5e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0b1726" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="164" fill="url(#hero)"/>
  <circle cx="1115" cy="58" r="136" fill="#4a8cc9" opacity=".16"/>
  <circle cx="1045" cy="10" r="72" fill="#9fc7ec" opacity=".12"/>

  <g transform="translate(62 39)">
    <rect x="0" y="0" width="54" height="54" rx="14" fill="#e9f4ff"/>
    <path d="M27 9 40 17v20L27 45 14 37V17Z" fill="#174d7a"/>
    <path d="m27 14 8 5v16l-8 5-8-5V19Z" fill="#8ec6f2"/>
    <text x="72" y="23" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="24" font-weight="760" fill="#fff">The Masterwork Vault</text>
    <text x="72" y="47" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#bed0e3" letter-spacing="1.4">NEVERWINTER MASTERWORK GUIDE</text>
  </g>

  <text x="62" y="128" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="34" font-weight="760" fill="#fff">Recipes, materials, and crafting plans in one place.</text>

  <g filter="url(#shadow)">
