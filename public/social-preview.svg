    <rect x="62" y="226" width="1076" height="20" fill="#ffffff"/>
    <circle cx="91" cy="217" r="8" fill="#d2d9e0"/>
    <rect x="116" y="207" width="170" height="20" rx="7" fill="#17283e"/>
    <rect x="836" y="202" width="76" height="30" rx="9" fill="#eaf1f7"/>
    <rect x="920" y="202" width="76" height="30" rx="9" fill="#eaf1f7"/>
    <rect x="1004" y="202" width="94" height="30" rx="9" fill="#17283e"/>

