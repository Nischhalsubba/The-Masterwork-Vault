    <text x="328" y="429" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#6e7e8d">ARMOR</text>
    <text x="328" y="449" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#1d2935">Masterwork Cuirass</text>
    <text x="328" y="466" font-family="Arial,sans-serif" font-size="11" fill="#73808d">Barbarian · Sharandar</text>

    <rect x="590" y="264" width="524" height="282" rx="18" fill="#fff" stroke="#d7e0e8"/>
    <rect x="612" y="286" width="62" height="62" rx="13" fill="#244764"/>
    <path d="M624 337 655 297l7 7-28 39Z" fill="#d7ecff"/>
    <rect x="691" y="288" width="84" height="20" rx="10" fill="#e8f3fb"/>
    <text x="706" y="302" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#2d6a98">SHARANDAR</text>
    <text x="691" y="333" font-family="Arial,sans-serif" font-size="24" font-weight="760" fill="#182532">Masterwork Longsword</text>
    <text x="691" y="355" font-family="Arial,sans-serif" font-size="12" fill="#71808f">Fighter · Weapon · screenshot-backed recipe</text>
    <rect x="978" y="288" width="113" height="38" rx="11" fill="#0875d1"/>
